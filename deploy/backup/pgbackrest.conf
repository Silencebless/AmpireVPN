# pgBackRest для AmpireVPN. Секреты (ключи S3, пароль шифрования) передаются переменными окружения
# PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS — в файл их не пишем.
[global]
repo1-type=s3
repo1-path=/ampirevpn
# шифрование репозитория на стороне клиента: пароль храните отдельно от сервера (менеджер паролей, сейф)
repo1-cipher-type=aes-256-cbc
# хранить 4 полных копии и 7 разностных; WAL хранится для восстановления на любой момент внутри этого окна
repo1-retention-full=4
repo1-retention-diff=7
compress-type=zst
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[ampire]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
