# Алерты AmpireVPN. Метки задач воркера — `task` (а не `job`, чтобы не конфликтовать с job Prometheus).
groups:
  - name: ampire-availability
    rules:
      - alert: WorkerDown
        expr: up{job="worker"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Воркер AmpireVPN не отвечает"
          description: "Не работают автопродление, истечение подписок, рассылки, сверка платежей. Проверьте контейнер ampire-worker."
      - alert: ApiReplicaDown
        expr: up{job="api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Реплика api {{ $labels.instance }} не отвечает"
      - alert: NoApiReplicas
        expr: count(up{job="api"} == 1) < 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Ни одной живой реплики api — бот не отвечает пользователям"

  - name: ampire-worker-jobs
    rules:
      - alert: WorkerJobFailing
        expr: increase(ampire_job_errors_total[15m]) >= 3
        labels: {severity: critical}
        annotations:
          summary: "Задача воркера «{{ $labels.task }}» падает"
          description: "{{ $value | printf \"%.0f\" }} ошибок за 15 минут. Журнал: Админка → Система → Журнал ошибок."
      - alert: WorkerJobStale
        # у быстрых задач допустимое молчание — 10 минут, у раз-в-полчаса — 2 часа; links (раз в 6 ч) не проверяем
        expr: |
          (time() - ampire_job_last_success_timestamp{task=~"expiry|payments|sync|outbox|broadcast|watchdog"} > 600)
          or (time() - ampire_job_last_success_timestamp{task=~"autopay|referrals|reminders"} > 1800)
          or (time() - ampire_job_last_success_timestamp{task=~"daily|recon"} > 7200)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Задача «{{ $labels.task }}» давно не выполнялась успешно"
      - alert: JobSlow
        expr: histogram_quantile(0.95, sum by (le, task) (rate(ampire_job_seconds_bucket[30m]))) > 120
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Задача «{{ $labels.task }}»: 95-й перцентиль длительности больше 2 минут"

  - name: ampire-business
    rules:
      - alert: PaymentsNeedReview
        expr: ampire_payments_needs_review > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Платежи на ручной проверке: {{ $value }}"
          description: "Деньги пришли, но подписка не начислена. Админка → Платежи → «На проверке»."
      - alert: PanelUnavailable
        expr: ampire_panel_circuit_open == 1
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Панель Remnawave недоступна"
          description: "Оплаты принимаются, доступ выдаётся после восстановления панели."
      - alert: SyncBacklog
        expr: ampire_sync_pending_users > 200
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Не синхронизировано с панелью: {{ $value }}"
      - alert: OutboxGrowing
        expr: ampire_outbox_size > 50
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "В очереди недоставленных важных сообщений: {{ $value }} (проверьте Telegram)"
      - alert: YooKassaReconStale
        expr: time() - ampire_yookassa_recon_last_run_timestamp > 129600
        labels: {severity: warning}
        annotations:
          summary: "Ежедневная сверка ЮKassa → БД не выполнялась более 36 часов"
      - alert: HappLinkDead
        expr: ampire_happ_link_ok == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Ссылка на скачивание Happ ({{ $labels.link }}) не работает"

  - name: ampire-infra
    rules:
      - alert: RedisDown
        expr: ampire_redis_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Redis недоступен (бот работает в режиме деградации)"
      - alert: HandlerErrors
        expr: sum(rate(ampire_handler_errors_total[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Растёт число ошибок в обработчиках бота"
      - alert: Web5xx
        expr: sum(rate(ampire_web_requests_total{status="5xx"}[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Веб-часть отвечает 5xx (вебхуки платежей могут теряться)"
